name: Build LiteNote.exe

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release exe
        run: cargo build --release

      # Release এ exe আপলোড করবে (Download করা যাবে)
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/litenote.exe

      # Push/manual run এ artifact হিসেবে রাখবে
      - name: Upload artifact (non-release)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: LiteNote-windows
          path: target/release/litenote.exe
